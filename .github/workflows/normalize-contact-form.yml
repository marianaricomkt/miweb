name: Normalize contact form line endings

on:
  push:
    branches:
      - feature/contact-form

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize index.html to CRLF
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          data = path.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          path.write_bytes(data)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            git rm .github/workflows/normalize-contact-form.yml
            git commit -m "chore: remove temporary workflow"
          else
            git commit -m "chore: preserve index line endings"
            git rm .github/workflows/normalize-contact-form.yml
            git commit -m "chore: remove temporary workflow"
          fi
          git push
